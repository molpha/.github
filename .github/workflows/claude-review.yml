# Reusable workflow: automatic Claude review of a pull request.
# Called from each repo's .github/workflows/claude.yml. Read-only: the job can
# comment on the PR but cannot edit code or run shell commands.
name: Claude review

on:
  workflow_call:
    inputs:
      model:
        description: Claude model ID
        type: string
        default: claude-sonnet-5-5
      max_turns:
        description: Upper bound on agent turns for one review
        type: string
        default: "30"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation: no API key. The IDs are org Actions variables.
          # Do not set ANTHROPIC_API_KEY in this job; it overrides federation.
          anthropic_federation_rule_id: ${{ vars.CLAUDE_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.CLAUDE_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.CLAUDE_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.CLAUDE_WORKSPACE_ID }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          use_sticky_comment: true
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
