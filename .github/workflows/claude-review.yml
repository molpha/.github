# Reusable workflow: Claude review of a pull request through the Claude API.
# Called from each repo's .github/workflows/claude.yml. Authenticates with
# workload identity federation (org variables CLAUDE_*), so there is no secret.
# It reads the repository and posts one review; it cannot push or run code.
name: Claude review

on:
  workflow_call:
    inputs:
      model:
        description: Claude model ID
        type: string
        default: claude-sonnet-5-5
      effort:
        description: low | medium | high | xhigh | max
        type: string
        default: medium
      max_iterations:
        description: Upper bound on API requests in one review
        type: string
        default: "30"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: molpha/.github/actions/review@v1
        with:
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          max_iterations: ${{ inputs.max_iterations }}
          federation_rule_id: ${{ vars.CLAUDE_FEDERATION_RULE_ID }}
          organization_id: ${{ vars.CLAUDE_ORGANIZATION_ID }}
          service_account_id: ${{ vars.CLAUDE_SERVICE_ACCOUNT_ID }}
          workspace_id: ${{ vars.CLAUDE_WORKSPACE_ID }}
