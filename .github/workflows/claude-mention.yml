# Reusable workflow: answer `@claude` mentions on pull requests and issues.
# Read-only in this first version: it can read the repo and comment, not push.
name: Claude mention

on:
  workflow_call:
    inputs:
      model:
        description: Claude model ID
        type: string
        default: claude-sonnet-5-5
      max_turns:
        description: Upper bound on agent turns for one reply
        type: string
        default: "30"

jobs:
  mention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation: no API key. The IDs are org Actions variables.
          # Do not set ANTHROPIC_API_KEY in this job; it overrides federation.
          anthropic_federation_rule_id: ${{ vars.CLAUDE_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.CLAUDE_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.CLAUDE_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.CLAUDE_WORKSPACE_ID }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
